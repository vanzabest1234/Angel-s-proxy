<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Bowl</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #070c09;
    color: #e8f2e9;
    font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }
  .rb { height: 100%; display: flex; flex-direction: column; }

  /* ---------- scoreboard ---------- */
  .rb-board {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: linear-gradient(180deg, #14231a, #0d1611);
    border-bottom: 2px solid #22372a;
  }
  .rb-team { display: flex; align-items: baseline; gap: 8px; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: #8fb79c; }
  .rb-team b { font-size: 22px; letter-spacing: 0; color: #fff; font-variant-numeric: tabular-nums; }
  .rb-team.away { justify-content: flex-end; }
  .rb-team.away b { color: #ff9d8f; }
  .rb-mid { display: grid; justify-items: center; gap: 1px; text-transform: uppercase; letter-spacing: .1em; text-align: center; }
  .rb-down { font-size: 11px; font-weight: 700; color: #ffd84a; }
  .rb-clock { font-size: 11px; color: #8fe0a5; font-variant-numeric: tabular-nums; }

  /* ---------- field ---------- */
  .rb-stage {
    position: relative;
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    background: radial-gradient(120% 100% at 50% 0%, #14231a 0%, #080f0b 70%);
  }
  canvas { display: block; border-radius: 10px; box-shadow: 0 14px 36px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .07); }

  .rb-msg {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    max-width: calc(100% - 32px);
    padding: 10px 18px; border-radius: 9px;
    background: rgba(8, 14, 10, .9); border: 2px solid #2f5138;
    color: #ffe680; font-size: 14px; font-weight: 700; letter-spacing: .05em;
    text-align: center; pointer-events: none;
  }
  .rb-msg:empty { display: none; }

  .rb-sound {
    position: absolute; right: 16px; bottom: 14px;
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid #2f5138; background: rgba(10, 18, 13, .8);
    color: #a9c9b6; font-size: 14px; cursor: pointer;
  }
  .rb-sound:hover { background: #1c2c22; color: #fff; }

  /* ---------- final overlay ---------- */
  .rb-over {
    position: absolute; inset: 0;
    display: grid; align-content: center; justify-items: center; gap: 8px;
    padding: 20px;
    background: radial-gradient(90% 90% at 50% 20%, rgba(20, 55, 34, .92), rgba(4, 8, 6, .96));
    text-align: center;
  }
  .rb-over[hidden] { display: none; }
  .rb-over-kicker { margin: 0; font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: #8fe0a5; }
  .rb-over h1 { margin: 0; font-size: clamp(22px, 4vw, 34px); letter-spacing: -.02em; color: #fff; }
  .rb-over-score { margin: 2px 0 0; display: flex; align-items: baseline; gap: 12px; font-size: clamp(28px, 6vw, 44px); font-weight: 700; }
  .rb-over-score em { font-style: normal; font-size: .5em; color: #6f8a78; }
  .rb-over-score span:last-child { color: #ff9d8f; }
  .rb-over-stats { margin: 4px 0 10px; font-size: 11.5px; line-height: 1.8; color: #a9c9b6; }
  .rb-again {
    border: 1px solid #48b06c; border-radius: 9px; background: #2c7a45;
    color: #fff; font: inherit; font-size: 12.5px; font-weight: 700; letter-spacing: .06em;
    padding: 11px 22px; cursor: pointer;
  }
  .rb-again:hover { background: #35904f; }

  /* ---------- controls ---------- */
  .rb-controls {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px 12px;
    background: #111a14;
    border-top: 2px solid #23372a;
  }
  .rb-pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 40px); gap: 6px; }
  .rb-pad .up { grid-column: 2; grid-row: 1; }
  .rb-pad .left { grid-column: 1; grid-row: 2; }
  .rb-pad .down { grid-column: 2; grid-row: 2; }
  .rb-pad .right { grid-column: 3; grid-row: 2; }
  .rb-acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  button {
    font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .05em;
    color: #d9ffe3; background: #1c2c22;
    border: 1px solid #33503d; border-radius: 8px;
    min-width: 44px; height: 40px; padding: 0 10px;
    cursor: pointer; touch-action: manipulation;
    transition: background 120ms ease, transform 90ms ease;
  }
  button:active { transform: translateY(1px); }
  button.rb-main { background: #2c7a45; border-color: #48b06c; color: #fff; }
  button.rb-throw { background: #243a7a; border-color: #4763c4; color: #eaf0ff; display: grid; place-items: center; gap: 0; padding: 0 9px; }
  button.rb-throw em { display: block; font-style: normal; font-size: 8.5px; letter-spacing: .04em; color: #a9b8e6; }
  button.rb-kick { background: #3a2c1c; border-color: #8a6a33; color: #ffe6b0; }

  .rb-hint {
    padding: 0 12px 8px; font-size: 10.5px; color: #6f8a78;
    background: #111a14; text-align: center;
  }

  @media (max-width: 620px) {
    .rb-acts button.rb-throw em { display: none; }
    .rb-acts button { padding: 0 8px; min-width: 38px; }
    button.rb-kick { display: none; }
    .rb-hint { display: none; }
  }
</style>
</head>
<body>
<div class="rb">
  <div class="rb-board">
    <div class="rb-team"><span>You</span><b id="you">0</b></div>
    <div class="rb-mid">
      <span class="rb-down" id="down">1st &amp; 10</span>
      <span class="rb-clock" id="clock">Q1 1:30</span>
    </div>
    <div class="rb-team away"><b id="opp">0</b><span>Opp</span></div>
  </div>

  <div class="rb-stage">
    <canvas id="field" width="1000" height="450"></canvas>
    <div class="rb-msg" id="msg">Press Snap to start the drive</div>
    <button class="rb-sound" id="sound" aria-label="Toggle sound">🔊</button>
    <div class="rb-over" id="over" hidden>
      <p class="rb-over-kicker">Final</p>
      <h1 id="over-title">You win</h1>
      <p class="rb-over-score"><span id="over-you">0</span><em>–</em><span id="over-opp">0</span></p>
      <p class="rb-over-stats" id="over-stats"></p>
      <button class="rb-again" id="again">Play again</button>
    </div>
  </div>

  <div class="rb-controls">
    <div class="rb-pad">
      <button class="up" data-move="up" aria-label="Move up">▲</button>
      <button class="left" data-move="left" aria-label="Move left">◀</button>
      <button class="down" data-move="down" aria-label="Move down">▼</button>
      <button class="right" data-move="right" aria-label="Move right">▶</button>
    </div>
    <div class="rb-acts">
      <button class="rb-main" id="snap">Snap</button>
      <button id="run">Run</button>
      <button class="rb-throw" data-throw="0">1<em>Quick</em></button>
      <button class="rb-throw" data-throw="1">2<em>Slant</em></button>
      <button class="rb-throw" data-throw="2">3<em>Deep</em></button>
      <button class="rb-kick" id="kick">FG</button>
    </div>
  </div>
  <div class="rb-hint">Arrows / WASD move · Snap = space · 1 2 3 = pass · R = run · FG = field goal</div>
</div>

<script>
(() => {
  const cvs = document.getElementById('field');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;
  const PAD = { l: 26, r: 26, t: 30, b: 12 };
  const FW = W - PAD.l - PAD.r;
  const FH = H - PAD.t - PAD.b;
  const U = FW / 120;
  const V = FH / 50;
  const X = (yd) => PAD.l + yd * U;
  const Y = (yd) => PAD.t + yd * V;
  const END = 110;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const rand = (n) => Math.random() * n;

  const el = {
    you: document.getElementById('you'),
    opp: document.getElementById('opp'),
    down: document.getElementById('down'),
    clock: document.getElementById('clock'),
    msg: document.getElementById('msg'),
    snap: document.getElementById('snap'),
    run: document.getElementById('run'),
    kick: document.getElementById('kick'),
    sound: document.getElementById('sound'),
    over: document.getElementById('over'),
    overTitle: document.getElementById('over-title'),
    overYou: document.getElementById('over-you'),
    overOpp: document.getElementById('over-opp'),
    overStats: document.getElementById('over-stats'),
    again: document.getElementById('again'),
  };

  const SPEED = { qb: 7.4, rb: 7.9, wr: 8.2, def: 6.4 };
  const ROUTE_NAMES = ['Quick', 'Slant', 'Deep'];

  let state = 'ready';
  let quarter = 1;
  let clock = 90;
  let you = 0, opp = 0;
  let down = 1;
  let firstDown = 35;
  let los = 25;
  let playTime = 0;
  let oppTimer = 0;
  let last = 0;
  let pending = null;
  let msg = 'Press Snap to start the drive';
  let qb, rb, receivers = [], defenders = [], carrier = null, ball = null;
  let shake = 0, flash = 0, confetti = [];
  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage blocked */ } },
  };
  let muted = storage.get('rb.muted') === '1';
  const held = { up: false, down: false, left: false, right: false };
  const stats = { plays: 0, yards: 0, td: 0, passes: 0, runs: 0, fga: 0, fgm: 0 };

  /* ---------- sound ---------- */
  let actx = null;
  function tone(freq, dur = 0.09, type = 'square', gain = 0.05, slide = 0) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(60, freq + slide), actx.currentTime + dur);
      g.gain.setValueAtTime(gain, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch { /* audio unavailable */ }
  }
  function scoreSound() { tone(523, 0.1, 'square', 0.05); setTimeout(() => tone(659, 0.1, 'square', 0.05), 90); setTimeout(() => tone(784, 0.16, 'square', 0.05), 180); }
  el.sound.textContent = muted ? '🔇' : '🔊';
  el.sound.addEventListener('click', () => {
    muted = !muted;
    storage.set('rb.muted', muted ? '1' : '0');
    el.sound.textContent = muted ? '🔇' : '🔊';
    if (!muted) tone(660, 0.08, 'sine', 0.04);
  });

  /* ---------- setup ---------- */
  function setupPlay() {
    const ys = [8, 25, 42];
    const routes = [
      [[los + 3, 8], [los + 18, 8], [los + 34, 6]],
      [[los + 2, 25], [los + 9, 21], [los + 17, 16]],
      [[los + 2, 42], [los + 12, 42], [los + 17, 46]],
    ];
    receivers = routes.map((pts, i) => ({ x: Math.min(los - 1, END - 1), y: ys[i], pts, wp: 0, n: i + 1, route: ROUTE_NAMES[i] }));
    qb = { x: Math.max(los - 3, 1), y: 25, num: 7 };
    rb = { x: Math.max(los - 1.7, 1), y: 25, num: 22 };
    defenders = [
      { x: Math.min(los + 6, END - 1), y: 9 },
      { x: Math.min(los + 7, END - 1), y: 25 },
      { x: Math.min(los + 6, END - 1), y: 41 },
      { x: Math.min(los + 15, END - 1), y: 16 },
      { x: Math.min(los + 15, END - 1), y: 34 },
    ];
    carrier = qb;
    ball = null;
    playTime = 0;
  }

  function newDrive(at, note) {
    los = at;
    down = 1;
    firstDown = Math.min(at + 10, END);
    setupPlay();
    state = 'ready';
    pending = null;
    msg = note || '';
  }

  function resetGame() {
    you = 0; opp = 0;
    quarter = 1; clock = 90;
    Object.assign(stats, { plays: 0, yards: 0, td: 0, passes: 0, runs: 0, fga: 0, fgm: 0 });
    confetti = [];
    el.over.hidden = true;
    newDrive(25);
    msg = '';
  }

  /* ---------- movement ---------- */
  function vec() {
    let x = 0, y = 0;
    if (held.left) x -= 1;
    if (held.right) x += 1;
    if (held.up) y -= 1;
    if (held.down) y += 1;
    const m = Math.hypot(x, y) || 1;
    return { x: x / m, y: y / m };
  }

  function runRoute(r, dt) {
    while (r.wp < r.pts.length) {
      const [rawX, ty] = r.pts[r.wp];
      const tx = clamp(rawX, 1, END - 1);
      const dx = tx - r.x, dy = ty - r.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.35) { r.wp += 1; continue; }
      const stride = Math.min(dist, SPEED.wr * dt);
      r.x += (dx / dist) * stride;
      r.y = clamp(r.y + (dy / dist) * stride, 1, 49);
      return;
    }
  }

  function updateLive(dt) {
    clock = Math.max(0, clock - dt);
    playTime += dt;

    const v = vec();
    const speed = carrier === qb ? SPEED.qb : (carrier === rb ? SPEED.rb : SPEED.wr);
    carrier.x = clamp(carrier.x + v.x * speed * dt, 0.8, END - 0.2);
    carrier.y = clamp(carrier.y + v.y * speed * dt, 1, 49);

    receivers.forEach((r) => { if (r !== carrier) runRoute(r, dt); });

    if (carrier.x >= END - 0.25) { touchdown(); return; }

    defenders.forEach((d) => {
      const dx = carrier.x - d.x, dy = carrier.y - d.y;
      const dist = Math.hypot(dx, dy) || 1;
      const sp = SPEED.def * (playTime < 0.5 ? 0.25 : 1);
      d.x = clamp(d.x + (dx / dist) * sp * dt, 0.5, END - 0.5);
      d.y = clamp(d.y + (dy / dist) * sp * dt, 0.5, 49.5);
      if (dist < 1.15) tackle();
    });
  }

  function updateFlight(dt) {
    clock = Math.max(0, clock - dt);
    ball.t += dt;
    const p = Math.min(ball.t / ball.dur, 1);
    ball.x = ball.x0 + (ball.x1 - ball.x0) * p;
    ball.y = ball.y0 + (ball.y1 - ball.y0) * p;
    ball.h = Math.sin(p * Math.PI) * Math.min(24, Math.hypot(ball.x1 - ball.x0, ball.y1 - ball.y0) * 1.6);

    receivers.forEach((r) => runRoute(r, dt));
    defenders.forEach((d) => {
      const dx = ball.x1 - d.x, dy = ball.y1 - d.y;
      const dist = Math.hypot(dx, dy) || 1;
      d.x = clamp(d.x + (dx / dist) * SPEED.def * 1.1 * dt, 0.5, END - 0.5);
      d.y = clamp(d.y + (dy / dist) * SPEED.def * 1.1 * dt, 0.5, 49.5);
    });

    if (p >= 1) resolvePass();
  }

  function resolvePass() {
    const landing = { x: ball.x1, y: ball.y1 };
    const target = receivers[ball.i];
    const covered = defenders.some((d) => Math.hypot(d.x - landing.x, d.y - landing.y) < 2.1);
    const reachable = target && Math.hypot(target.x - landing.x, target.y - landing.y) < 6;
    ball = null;
    if (covered && Math.random() < 0.38) {
      msg = 'Intercepted!';
      tone(140, 0.3, 'sawtooth', 0.06, -60);
      state = 'dead';
      pending = opponentPossession;
      return;
    }
    if (covered || !reachable) {
      state = 'dead';
      down += 1;
      if (down > 4) {
        msg = 'Turnover on downs';
        pending = opponentPossession;
      } else {
        msg = 'Incomplete pass';
        pending = () => { setupPlay(); state = 'ready'; };
      }
      return;
    }
    carrier = target;
    carrier.x = clamp(landing.x, 1, END - 0.3);
    carrier.y = clamp(landing.y, 1, 49);
    state = 'live';
    playTime = 0;
    msg = '';
    tone(640, 0.07, 'square', 0.045);
  }

  function tackle() {
    if (state !== 'live') return;
    const spot = clamp(carrier.x, 1, END - 0.1);
    stats.yards += Math.max(0, Math.round(spot - los));
    shake = 0.9;
    tone(96, 0.12, 'sawtooth', 0.05);
    state = 'dead';
    if (spot >= firstDown) {
      down = 1;
      firstDown = Math.min(spot + 10, END);
      msg = 'First down!';
    } else {
      down += 1;
      msg = 'Tackled';
    }
    if (down > 4) {
      msg = 'Turnover on downs';
      pending = opponentPossession;
      return;
    }
    los = spot;
    pending = () => { setupPlay(); state = 'ready'; };
  }

  function touchdown() {
    you += 6;
    stats.td += 1;
    const good = Math.random() < 0.95;
    if (good) you += 1;
    msg = good ? 'TOUCHDOWN!  +7' : 'TOUCHDOWN!  Kick missed (+6)';
    flash = 1;
    shake = 1.2;
    burst();
    scoreSound();
    state = 'dead';
    pending = opponentPossession;
  }

  function fieldGoal() {
    if (state !== 'ready') return;
    const dist = END - los;
    if (dist > 38) { msg = 'Too far for a field goal'; tone(120, 0.1, 'square', 0.04); return; }
    stats.fga += 1;
    state = 'dead';
    const good = Math.random() < clamp(0.97 - dist * 0.023, 0.28, 0.95);
    if (good) {
      you += 3;
      stats.fgm += 1;
      msg = 'Field goal is good!  +3';
      scoreSound();
    } else {
      msg = 'Field goal is no good';
      tone(120, 0.25, 'sawtooth', 0.05, -40);
    }
    pending = opponentPossession;
  }

  function opponentPossession() {
    clock = Math.max(0, clock - 16);
    state = 'opp';
    oppTimer = 2.3;
    pending = null;
    ball = null;
    msg = 'Opponent ball…';
    const roll = Math.random();
    if (roll < 0.42) { opp += 7; msg = 'Opponent touchdown  +7'; tone(180, 0.2, 'sawtooth', 0.05, -50); }
    else if (roll < 0.7) { opp += 3; msg = 'Opponent field goal  +3'; tone(180, 0.16, 'sawtooth', 0.05, -40); }
    else { msg = 'Opponent punts — your ball'; }
  }

  function endQuarter() {
    if (quarter >= 4) { gameOver(); return; }
    quarter += 1;
    clock = 90;
    newDrive(25);
    msg = 'Start of Q' + quarter;
  }

  function gameOver() {
    state = 'over';
    msg = '';
    el.over.hidden = false;
    el.overTitle.textContent = you > opp ? 'You win!' : you < opp ? 'Opponent wins' : 'Tie game';
    el.overYou.textContent = you;
    el.overOpp.textContent = opp;
    el.overStats.innerHTML =
      `${stats.td} touchdown${stats.td === 1 ? '' : 's'} · ${stats.yards} yards gained<br>` +
      `${stats.passes} passes · ${stats.runs} runs · ${stats.fgm}/${stats.fga} field goals`;
    try { parent.postMessage({ type: 'retrobowl:final', you, opp }, '*'); } catch { /* no parent */ }
  }

  function action() {
    if (state === 'over') { resetGame(); return; }
    if (state === 'ready') {
      state = 'live';
      playTime = 0;
      stats.plays += 1;
      msg = '';
      tone(220, 0.07, 'square', 0.04, 90);
      return;
    }
    if (state === 'dead') {
      if (clock <= 0) { endQuarter(); return; }
      const fn = pending;
      pending = null;
      if (fn) fn(); else setupPlay();
      if (state === 'dead' || state === 'ready') { state = 'ready'; playTime = 0; msg = ''; }
    }
  }

  function handoff() {
    if (state !== 'live' || carrier !== qb) return;
    carrier = rb;
    carrier.y = qb.y;
    stats.runs += 1;
    msg = '';
    tone(200, 0.07, 'square', 0.04, -40);
  }

  function pass(i) {
    if (state !== 'live' || carrier !== qb) return;
    const r = receivers[i];
    if (!r) return;
    const x1 = clamp(r.x + 3.5, 1, END - 0.5);
    const y1 = clamp(r.y, 1, 49);
    const dist = Math.hypot(x1 - qb.x, y1 - qb.y);
    ball = { i, x0: qb.x, y0: qb.y, x1, y1, x: qb.x, y: qb.y, h: 0, t: 0, dur: Math.max(0.3, dist / 40) };
    stats.passes += 1;
    state = 'flight';
    msg = 'Pass in the air…';
    tone(420, 0.12, 'sine', 0.04, 260);
  }

  /* ---------- effects ---------- */
  function burst() {
    for (let i = 0; i < 46; i += 1) {
      confetti.push({
        x: X(END - 3), y: Y(25),
        vx: (Math.random() - 0.5) * 300,
        vy: -Math.random() * 250 - 40,
        life: 1,
        c: ['#ffd84a', '#ff7a3d', '#8fe0a5', '#ffffff'][i % 4],
      });
    }
  }

  function updateEffects(dt) {
    shake = Math.max(0, shake - dt * 2.4);
    flash = Math.max(0, flash - dt * 1.8);
    confetti.forEach((p) => {
      p.vy += 460 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 0.7;
    });
    confetti = confetti.filter((p) => p.life > 0);
  }

  /* ---------- render ---------- */
  function drawField() {
    const bg = ctx.createLinearGradient(0, PAD.t, 0, PAD.t + FH);
    bg.addColorStop(0, '#328740');
    bg.addColorStop(0.5, '#2c7d3a');
    bg.addColorStop(1, '#276f34');
    ctx.fillStyle = bg;
    ctx.fillRect(PAD.l, PAD.t, FW, FH);

    for (let yd = 0; yd < 120; yd += 10) {
      if ((yd / 10) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(X(yd), PAD.t, 10 * U, FH);
      }
    }

    ctx.fillStyle = '#175a2b';
    ctx.fillRect(X(0), PAD.t, 10 * U, FH);
    ctx.fillStyle = '#1a6631';
    ctx.fillRect(X(110), PAD.t, 10 * U, FH);

    ctx.strokeStyle = 'rgba(255,255,255,0.42)';
    ctx.lineWidth = 1.5;
    for (let yd = 10; yd <= 110; yd += 5) {
      ctx.beginPath();
      ctx.moveTo(X(yd), PAD.t);
      ctx.lineTo(X(yd), PAD.t + FH);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 3;
    [0, 10, 110, 120].forEach((yd) => {
      ctx.beginPath();
      ctx.moveTo(X(yd), PAD.t);
      ctx.lineTo(X(yd), PAD.t + FH);
      ctx.stroke();
    });

    /* hash marks */
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    for (let yd = 11; yd < 110; yd += 1) {
      if (yd % 5 === 0) continue;
      ctx.beginPath();
      ctx.moveTo(X(yd), PAD.t + FH / 2 - 5);
      ctx.lineTo(X(yd), PAD.t + FH / 2 + 5);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '600 14px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    for (let yd = 20; yd <= 100; yd += 10) {
      const label = yd <= 60 ? yd : 120 - yd;
      ctx.fillText(String(label), X(yd), PAD.t + 16);
      ctx.fillText(String(label), X(yd), PAD.t + FH - 7);
    }

    ctx.save();
    ctx.translate(X(5), PAD.t + FH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '700 14px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('ANGELS', 0, 5);
    ctx.restore();
    ctx.save();
    ctx.translate(X(115), PAD.t + FH / 2);
    ctx.rotate(Math.PI / 2);
    ctx.font = '700 14px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('END ZONE', 0, 5);
    ctx.restore();

    /* first-down line */
    ctx.strokeStyle = 'rgba(255,216,74,0.92)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(X(firstDown), PAD.t);
    ctx.lineTo(X(firstDown), PAD.t + FH);
    ctx.stroke();

    /* line of scrimmage */
    ctx.strokeStyle = 'rgba(120,200,255,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(X(los), PAD.t);
    ctx.lineTo(X(los), PAD.t + FH);
    ctx.stroke();
  }

  function drawRoutes() {
    if (state !== 'ready') return;
    receivers.forEach((r) => {
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(X(r.x), Y(r.y));
      r.pts.forEach(([px, py]) => ctx.lineTo(X(clamp(px, 0, END)), Y(clamp(py, 0, 50))));
      ctx.stroke();
      ctx.restore();

      const end = r.pts[r.pts.length - 1];
      const bx = X(clamp(end[0], 1, END - 1));
      const by = Y(clamp(end[1], 1, 49));
      ctx.beginPath();
      ctx.arc(bx, by, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,216,74,0.92)';
      ctx.fill();
      ctx.fillStyle = '#14210f';
      ctx.font = '700 11px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(r.n), bx, by);
    });
    ctx.textBaseline = 'alphabetic';
  }

  function shadow(p) {
    ctx.beginPath();
    ctx.ellipse(X(p.x) + 2, Y(p.y) + 4, 9, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fill();
  }

  function dot(p, color, options = {}) {
    shadow(p);
    const cx = X(p.x), cy = Y(p.y);
    const r = Math.max(7, U * 0.95);
    if (options.ring) {
      ctx.beginPath();
      ctx.arc(cx, cy, r + 3.5 + Math.sin(performance.now() / 160) * 1.2, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd84a';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    if (options.num) {
      ctx.fillStyle = options.numColor || '#16261a';
      ctx.font = '700 9px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(options.num), cx, cy + 0.5);
    }
  }

  function drawBall() {
    if (!ball) return;
    const bx = X(ball.x), by = Y(ball.y);
    const lift = (ball.h || 0) * 1.4;
    ctx.beginPath();
    ctx.ellipse(bx, by + 3, 5.5, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(bx, by - lift, 6.5, 4.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#b4662f';
    ctx.fill();
    ctx.strokeStyle = '#f6efe6';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  function drawConfetti() {
    confetti.forEach((p) => {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, 4, 6);
    });
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#070c09';
    ctx.fillRect(0, 0, W, H);

    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * 8 * shake, (Math.random() - 0.5) * 8 * shake);
    }

    drawField();
    drawRoutes();

    receivers.forEach((r) => dot(r, r === carrier ? '#ffffff' : '#f2f6ff', { ring: r === carrier, num: r.n === 1 ? 11 : r.n === 2 ? 84 : 88 }));
    dot(rb, rb === carrier ? '#ffffff' : '#d9e4ff', { ring: rb === carrier, num: rb.num });
    dot(qb, qb === carrier ? '#ffffff' : '#eef3ff', { ring: qb === carrier, num: qb.num });
    defenders.forEach((d) => dot(d, '#f05a45', {}));

    drawBall();
    drawConfetti();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 245, 200, ${flash * 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function downText() {
    const names = ['1st', '2nd', '3rd', '4th'];
    const toGo = Math.max(1, Math.round(firstDown - los));
    return (names[down - 1] || '4th') + ' & ' + (firstDown >= END ? 'Goal' : toGo);
  }

  function hud() {
    el.you.textContent = String(you);
    el.opp.textContent = String(opp);
    el.down.textContent = downText();
    const m = Math.floor(clock / 60);
    const s = String(Math.floor(clock % 60)).padStart(2, '0');
    el.clock.textContent = 'Q' + quarter + ' ' + m + ':' + s;
    if (el.msg.textContent !== msg) el.msg.textContent = msg;
    el.snap.textContent = state === 'over' ? 'Again' : (state === 'dead' ? 'Next' : 'Snap');
  }

  function fit() {
    const stage = cvs.parentElement;
    const availW = stage.clientWidth - 16;
    const availH = stage.clientHeight - 16;
    if (availW <= 0 || availH <= 0) return;
    const scale = Math.min(availW / W, availH / H);
    cvs.style.width = Math.round(W * scale) + 'px';
    cvs.style.height = Math.round(H * scale) + 'px';
  }

  function frame(ts) {
    const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0);
    last = ts;

    if (state === 'live') updateLive(dt);
    else if (state === 'flight') updateFlight(dt);
    else if (state === 'opp') {
      oppTimer -= dt;
      if (oppTimer <= 0) {
        if (clock <= 0) endQuarter();
        else { newDrive(25); msg = 'Your ball — pick a play'; }
      }
    }

    updateEffects(dt);
    draw();
    hud();
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
  };

  window.addEventListener('keydown', (e) => {
    if (KEYS[e.key]) {
      held[KEYS[e.key]] = true;
      e.preventDefault();
      return;
    }
    if (e.key === ' ' || e.key === 'Enter') { action(); e.preventDefault(); return; }
    if (e.key === 'r' || e.key === 'R') { handoff(); return; }
    if (e.key === '1' || e.key === '2' || e.key === '3') { pass(Number(e.key) - 1); return; }
    if (e.key === 'f' || e.key === 'F') { fieldGoal(); }
  });

  window.addEventListener('keyup', (e) => {
    if (KEYS[e.key]) { held[KEYS[e.key]] = false; e.preventDefault(); }
  });

  document.querySelectorAll('[data-move]').forEach((btn) => {
    const dir = btn.dataset.move;
    const on = (e) => { e.preventDefault(); held[dir] = true; };
    const off = (e) => { e.preventDefault(); held[dir] = false; };
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointerleave', off);
    btn.addEventListener('pointercancel', off);
  });

  el.snap.addEventListener('click', action);
  el.run.addEventListener('click', handoff);
  el.kick.addEventListener('click', fieldGoal);
  el.again.addEventListener('click', resetGame);
  document.querySelectorAll('[data-throw]').forEach((btn) => {
    btn.addEventListener('click', () => pass(Number(btn.dataset.throw)));
  });

  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(cvs.parentElement);

  fit();
  setupPlay();
  hud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
