services:
  api:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: ["node", "--watch", "server/index.mjs"]
    restart: on-failure
    environment:
      - PORT=8000
      - BASE44_PREVIEW_MODE
    # Platform-managed secrets (Brave Search API key) are delivered outside the repo.
    env_file:
      - path: /run/base44/app.env
        required: false
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
    labels:
      base44.project: "Angel Desktop Search API"
      base44.kind: "api"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npx vite --host 0.0.0.0 --port 5173 --strictPort
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:5173"
    environment:
      - API_PROXY_TARGET=http://api:8000
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
      - "web_node_modules:/workspace/node_modules"
    labels:
      base44.project: "Angel Desktop"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

volumes:
  web_node_modules:
