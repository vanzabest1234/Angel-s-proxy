<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redline Rush</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0708;
    color: #f3e9e8;
    font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }
  .rl { height: 100%; display: flex; flex-direction: column; }

  /* ---------- stage ---------- */
  .rl-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #070507; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------- hud ---------- */
  .rl-hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; align-items: flex-end; gap: 12px;
    padding: 9px 12px 18px;
    background: linear-gradient(180deg, rgba(8, 5, 6, 0.9), rgba(8, 5, 6, 0));
    pointer-events: none;
  }
  .rl-score, .rl-best { display: grid; gap: 1px; }
  .rl-score span, .rl-best span {
    font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #ff8a95;
  }
  .rl-score b { font-size: 23px; line-height: 1.05; color: #fff; font-variant-numeric: tabular-nums; }
  .rl-best b { font-size: 12.5px; color: #d7c3c4; font-variant-numeric: tabular-nums; }
  .rl-speed { margin-left: auto; display: flex; align-items: baseline; gap: 4px; }
  .rl-speed b { font-size: 19px; color: #ffd84a; font-variant-numeric: tabular-nums; }
  .rl-speed span { font-size: 8.5px; letter-spacing: 0.18em; text-transform: uppercase; color: #a08b8b; }

  .rl-nitro {
    position: absolute; left: 12px; bottom: 12px;
    width: min(190px, 46%); height: 22px;
    border-radius: 999px; overflow: hidden;
    background: rgba(14, 8, 10, 0.78);
    border: 1px solid rgba(255, 59, 77, 0.42);
    pointer-events: none;
    transition: box-shadow 120ms ease;
  }
  .rl-nitro span {
    position: absolute; inset: 0; width: 100%;
    background: linear-gradient(90deg, #ff3b4d, #ff7a3d);
    transition: width 90ms linear;
  }
  .rl-nitro em {
    position: relative; display: block; text-align: center; line-height: 22px;
    font-style: normal; font-size: 8.5px; letter-spacing: 0.24em; text-transform: uppercase;
    color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
  }
  .rl-nitro.is-on { box-shadow: 0 0 18px rgba(255, 90, 60, 0.7); }

  .rl-sound {
    position: absolute; right: 12px; bottom: 12px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid rgba(255, 59, 77, 0.45);
    background: rgba(14, 9, 11, 0.82);
    color: #ff9aa2; font-size: 13px; cursor: pointer;
  }
  .rl-sound:hover { background: #221016; color: #fff; }

  /* ---------- overlays ---------- */
  .rl-intro, .rl-over {
    position: absolute; inset: 0;
    display: grid; align-content: center; justify-items: center; gap: 8px;
    padding: 20px; text-align: center;
    background: radial-gradient(120% 85% at 50% 18%, rgba(74, 9, 20, 0.9), rgba(6, 4, 6, 0.97));
  }
  .rl-intro[hidden], .rl-over[hidden] { display: none; }
  .rl-kicker {
    margin: 0; font-size: 9px; letter-spacing: 0.34em; text-transform: uppercase; color: #ff8a95;
  }
  h1 {
    margin: 0; font-size: clamp(24px, 5.4vw, 38px); letter-spacing: -0.02em; color: #fff;
    text-shadow: 0 0 26px rgba(255, 59, 77, 0.55);
  }
  .rl-tip { margin: 2px 0 0; max-width: 42ch; font-size: 12px; line-height: 1.65; color: #d3bcc0; }
  .rl-keys { margin: 2px 0 0; font-size: 10px; letter-spacing: 0.06em; color: #8e757b; }
  .rl-start {
    margin-top: 8px; border: 1px solid #ff6b78; border-radius: 10px;
    background: linear-gradient(180deg, #ff3b4d, #a90f1f);
    color: #fff; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.07em;
    padding: 12px 26px; cursor: pointer;
    box-shadow: 0 10px 28px rgba(200, 20, 45, 0.4);
    transition: transform 110ms ease, filter 110ms ease;
  }
  .rl-start:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .rl-start:active { transform: translateY(1px); }
  .rl-over-score { margin: 2px 0 0; display: flex; align-items: baseline; gap: 9px; }
  .rl-over-score span { font-size: clamp(30px, 6.5vw, 46px); font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .rl-over-score em { font-style: normal; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #b3929a; }
  .rl-over-note { margin: 0 0 6px; font-size: 11px; color: #ffd84a; }

  /* ---------- controls ---------- */
  .rl-controls {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 10px;
    background: #100a0c; border-top: 2px solid #2a1218;
  }
  .rl-steer, .rl-nitro-btn {
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
    color: #ffe9ea; border-radius: 9px; height: 46px; cursor: pointer;
    touch-action: manipulation;
    transition: background 110ms ease, transform 90ms ease;
  }
  .rl-steer { flex: 1; background: #1c1216; border: 1px solid #3b2229; }
  .rl-steer:active { transform: translateY(1px); background: #2a181e; }
  .rl-nitro-btn {
    flex: 1.25; border: 1px solid #ff6b78;
    background: linear-gradient(180deg, #e0182f, #7d0a16);
    color: #fff;
  }
  .rl-nitro-btn:active { transform: translateY(1px); filter: brightness(1.12); }

  @media (max-width: 620px) {
    .rl-nitro { width: min(150px, 44%); }
    .rl-controls { padding: 7px 8px 8px; }
    .rl-keys { display: none; }
  }
  @media (max-height: 460px) {
    .rl-tip, .rl-keys { display: none; }
    .rl-controls { padding: 6px 8px; }
    .rl-steer, .rl-nitro-btn { height: 40px; }
  }
</style>
</head>
<body>
<div class="rl">
  <div class="rl-stage" id="stage">
    <canvas id="road"></canvas>

    <div class="rl-hud">
      <div class="rl-score"><span>Score</span><b id="score">0</b></div>
      <div class="rl-best"><span>Best</span><b id="best">0</b></div>
      <div class="rl-speed"><b id="speed">0</b><span>mph</span></div>
    </div>

    <div class="rl-nitro" id="nitro-wrap"><span id="nitro-fill"></span><em>Nitro</em></div>
    <button class="rl-sound" id="sound" aria-label="Toggle sound">🔊</button>

    <div class="rl-intro" id="intro">
      <p class="rl-kicker">Games made by me</p>
      <h1>Redline Rush</h1>
      <p class="rl-tip">Dodge traffic, grab coins and hold nitro for double points. One hit ends the run.</p>
      <button class="rl-start" id="start">Start engine</button>
      <p class="rl-keys">← → steer · Space nitro · drag the road on touch</p>
    </div>

    <div class="rl-over" id="over" hidden>
      <p class="rl-kicker">Run over</p>
      <h1 id="over-title">Crashed</h1>
      <p class="rl-over-score"><span id="over-score">0</span><em>points</em></p>
      <p class="rl-over-note" id="over-note"></p>
      <button class="rl-start" id="again">Race again</button>
    </div>
  </div>

  <div class="rl-controls">
    <button class="rl-steer" id="left" aria-label="Steer left">◀</button>
    <button class="rl-nitro-btn" id="nitro">Nitro</button>
    <button class="rl-steer" id="right" aria-label="Steer right">▶</button>
  </div>
</div>

<script>
(() => {
  const cvs = document.getElementById('road');
  const ctx = cvs.getContext('2d');
  const stage = document.getElementById('stage');
  const el = {
    score: document.getElementById('score'),
    best: document.getElementById('best'),
    speed: document.getElementById('speed'),
    nitroWrap: document.getElementById('nitro-wrap'),
    nitroFill: document.getElementById('nitro-fill'),
    sound: document.getElementById('sound'),
    intro: document.getElementById('intro'),
    over: document.getElementById('over'),
    overTitle: document.getElementById('over-title'),
    overScore: document.getElementById('over-score'),
    overNote: document.getElementById('over-note'),
    start: document.getElementById('start'),
    again: document.getElementById('again'),
    left: document.getElementById('left'),
    right: document.getElementById('right'),
    nitro: document.getElementById('nitro'),
  };

  const LANES = 4;
  const CAR_COLORS = ['#3b82f6', '#f59e0b', '#a78bfa', '#e5e7eb', '#22d3ee', '#84cc16', '#f472b6'];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const rand = (n) => Math.random() * n;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage blocked */ } },
  };

  let W = 0, H = 0, DPR = 1, roadW = 0, roadX = 0, laneW = 0, dash = 0;
  let state = 'intro';
  let lane = 1;
  const player = { x: 0, y: 0, w: 44, h: 86 };
  let traffic = [], coins = [], sparks = [], streaks = [];
  let scoreF = 0, elapsed = 0, speed = 0, spawnTimer = 0.7, coinTimer = 1.4;
  let nitro = 100, boosting = false, shake = 0, flash = 0;
  let best = Number(storage.get('rl.best')) || 0;
  let muted = storage.get('rl.muted') === '1';
  const held = { left: false, right: false, nitro: false };
  let dragging = false;
  let last = 0;

  el.best.textContent = best;
  el.sound.textContent = muted ? '🔇' : '🔊';

  /* ---------- helpers ---------- */
  function rr(x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = clamp(((n >> 16) & 255) + amt, 0, 255);
    const g = clamp(((n >> 8) & 255) + amt, 0, 255);
    const b = clamp((n & 255) + amt, 0, 255);
    return `rgb(${r}, ${g}, ${b})`;
  }

  const laneCenter = (i) => roadX + laneW * (i + 0.5);

  /* ---------- fit ---------- */
  function fit() {
    const rect = stage.getBoundingClientRect();
    W = Math.max(240, Math.round(rect.width));
    H = Math.max(200, Math.round(rect.height));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width = `${W}px`;
    cvs.style.height = `${H}px`;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    roadW = Math.min(W * 0.94, Math.max(230, H * 0.72));
    roadX = (W - roadW) / 2;
    laneW = roadW / LANES;

    player.w = Math.min(laneW * 0.52, 54);
    player.h = player.w * 1.95;
    player.y = H - player.h - Math.max(18, H * 0.06);
    player.x = laneCenter(lane);
  }

  /* ---------- sound ---------- */
  let actx = null;
  let engine = null, engineGain = null;

  function audio() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, dur = 0.09, type = 'square', gain = 0.05, slide = 0) {
    if (muted) return;
    try {
      const ac = audio();
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(50, freq + slide), ac.currentTime + dur);
      g.gain.setValueAtTime(gain, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch { /* audio unavailable */ }
  }

  function noise(dur = 0.35, gain = 0.09) {
    if (muted) return;
    try {
      const ac = audio();
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource();
      const g = ac.createGain();
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 900;
      src.buffer = buf;
      g.gain.value = gain;
      src.connect(lp); lp.connect(g); g.connect(ac.destination);
      src.start();
    } catch { /* audio unavailable */ }
  }

  function startEngine() {
    if (muted) return;
    try {
      const ac = audio();
      stopEngine();
      engine = ac.createOscillator();
      engineGain = ac.createGain();
      engine.type = 'sawtooth';
      engine.frequency.value = 62;
      engineGain.gain.value = 0.022;
      engine.connect(engineGain); engineGain.connect(ac.destination);
      engine.start();
    } catch { engine = null; engineGain = null; }
  }

  function stopEngine() {
    if (!engine) return;
    try {
      engineGain.gain.setTargetAtTime(0.0001, actx.currentTime, 0.05);
      engine.stop(actx.currentTime + 0.2);
    } catch { /* already stopped */ }
    engine = null; engineGain = null;
  }

  el.sound.addEventListener('click', () => {
    muted = !muted;
    storage.set('rl.muted', muted ? '1' : '0');
    el.sound.textContent = muted ? '🔇' : '🔊';
    if (muted) stopEngine();
    else { if (state === 'run') startEngine(); tone(660, 0.08, 'sine', 0.04); }
  });

  /* ---------- gameplay ---------- */
  function startRun() {
    traffic = []; coins = []; sparks = []; streaks = [];
    scoreF = 0; elapsed = 0; nitro = 100; boosting = false;
    shake = 0; flash = 0; spawnTimer = 0.75; coinTimer = 1.5;
    lane = 1;
    player.x = laneCenter(1);
    state = 'run';
    el.intro.hidden = true;
    el.over.hidden = true;
    startEngine();
    tone(320, 0.12, 'square', 0.05, 260);
  }

  function spawnTraffic() {
    const occupied = new Set();
    traffic.forEach((c) => { if (c.y < player.h * 2.4) occupied.add(c.lane); });
    const free = [];
    for (let i = 0; i < LANES; i += 1) if (!occupied.has(i)) free.push(i);
    if (free.length <= 1) return;

    const count = free.length >= 3 && Math.random() < 0.38 ? 2 : 1;
    for (let n = 0; n < count && free.length; n += 1) {
      const ln = free.splice(Math.floor(Math.random() * free.length), 1)[0];
      const w = Math.min(laneW * 0.52, 54);
      traffic.push({
        lane: ln,
        x: laneCenter(ln),
        y: -w * 1.95 - rand(H * 0.22),
        w,
        h: w * 1.95,
        vy: H * 0.1 + rand(H * 0.16),
        color: pick(CAR_COLORS),
        passed: false,
      });
    }
  }

  function spawnCoins() {
    const ln = Math.floor(Math.random() * LANES);
    const n = Math.random() < 0.45 ? 3 : 1;
    for (let i = 0; i < n; i += 1) {
      coins.push({ x: laneCenter(ln), y: -24 - i * 34, t: rand(6) });
    }
  }

  function crash() {
    if (state !== 'run') return;
    state = 'over';
    shake = 1;
    flash = 1;
    for (let i = 0; i < 40; i += 1) {
      sparks.push({
        x: player.x + rand(player.w) - player.w / 2,
        y: player.y + rand(player.h),
        vx: (Math.random() - 0.5) * 340,
        vy: -Math.random() * 320 - 30,
        life: 1,
        c: ['#ffd84a', '#ff7a3d', '#ff3b4d', '#fff'][i % 4],
      });
    }
    noise(0.45, 0.11);
    stopEngine();

    const score = Math.floor(scoreF);
    if (score > best) {
      best = score;
      storage.set('rl.best', String(best));
      el.best.textContent = best;
      el.overNote.textContent = 'New personal best!';
    } else {
      el.overNote.textContent = `Best ${best}`;
    }
    el.overScore.textContent = score;
    el.over.hidden = false;
    try { parent.postMessage({ type: 'redline:final', you: score }, '*'); } catch { /* no parent */ }
  }

  function updateRun(dt) {
    elapsed += dt;
    const level = clamp(elapsed / 80, 0, 1);
    boosting = held.nitro && nitro > 0;
    const boost = boosting ? 1.75 : 1;

    if (boosting) nitro = Math.max(0, nitro - 32 * dt);
    else nitro = Math.min(100, nitro + 7 * dt);

    speed = (H * 0.62) * (1 + level * 0.85) * boost;
    scoreF += (speed * dt) / 11 * (boosting ? 2 : 1);

    const steerSpeed = Math.max(220, roadW * 0.9);
    if (held.left) player.x -= steerSpeed * dt;
    if (held.right) player.x += steerSpeed * dt;
    player.x = clamp(player.x, roadX + player.w * 0.6, roadX + roadW - player.w * 0.6);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = Math.max(0.34, 0.85 - elapsed * 0.006);
      spawnTraffic();
    }
    coinTimer -= dt;
    if (coinTimer <= 0) {
      coinTimer = 1.4 + rand(1.6);
      spawnCoins();
    }

    traffic.forEach((c) => { c.y += (speed + c.vy) * dt; });
    coins.forEach((c) => { c.y += speed * dt; c.t += dt; });

    // near misses
    traffic.forEach((c) => {
      if (!c.passed && c.y > player.y + player.h * 0.65) {
        c.passed = true;
        if (Math.abs(c.x - player.x) < (c.w + player.w) / 2 + 18) {
          scoreF += 25 * (boosting ? 2 : 1);
          tone(880, 0.05, 'sine', 0.03, 120);
        }
      }
    });

    // collision
    for (const c of traffic) {
      if (Math.abs(player.x - c.x) < (player.w + c.w) / 2 - 5 &&
          Math.abs((player.y + player.h / 2) - (c.y + c.h / 2)) < (player.h + c.h) / 2 - 8) {
        crash();
        break;
      }
    }

    // coins
    coins = coins.filter((c) => {
      const dx = Math.abs(c.x - player.x);
      const dy = Math.abs(c.y - (player.y + player.h / 2));
      if (dx < player.w * 0.55 + 8 && dy < player.h * 0.42 + 10) {
        scoreF += boosting ? 100 : 50;
        tone(1040, 0.07, 'triangle', 0.05, 280);
        return false;
      }
      return c.y < H + 40;
    });

    traffic = traffic.filter((c) => c.y < H + 140);

    if (boosting) {
      for (let i = 0; i < 2; i += 1) {
        streaks.push({ x: roadX + rand(roadW), y: rand(H), len: 30 + rand(70), v: speed * 2.4 });
      }
    }
    streaks.forEach((s) => { s.y += s.v * dt; });
    streaks = streaks.filter((s) => s.y < H + 80);
  }

  function updateIdle(dt) {
    speed = H * 0.24;
    elapsed += dt;
    coins.forEach((c) => { c.t += dt; });
    sparks.forEach((p) => {
      p.vy += 520 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 0.8;
    });
    sparks = sparks.filter((p) => p.life > 0);
    shake = Math.max(0, shake - dt * 2.2);
    flash = Math.max(0, flash - dt * 1.6);
  }

  /* ---------- rendering ---------- */
  function drawCar(x, y, w, h, body, rear) {
    const r = w * 0.26;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    rr(x - w / 2 + 3, y + 5, w, h, r); ctx.fill();

    ctx.fillStyle = '#050506';
    rr(x - w / 2 - 1.5, y + h * 0.12, w * 0.16, h * 0.2, 2); ctx.fill();
    rr(x + w / 2 - w * 0.145, y + h * 0.12, w * 0.16, h * 0.2, 2); ctx.fill();
    rr(x - w / 2 - 1.5, y + h * 0.66, w * 0.16, h * 0.2, 2); ctx.fill();
    rr(x + w / 2 - w * 0.145, y + h * 0.66, w * 0.16, h * 0.2, 2); ctx.fill();

    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, shade(body, -52));
    g.addColorStop(0.34, shade(body, 22));
    g.addColorStop(0.56, body);
    g.addColorStop(1, shade(body, -58));
    rr(x - w / 2, y, w, h, r);
    ctx.fillStyle = g; ctx.fill();

    ctx.fillStyle = 'rgba(8, 11, 16, 0.88)';
    rr(x - w * 0.33, y + h * 0.2, w * 0.66, h * 0.2, r * 0.6); ctx.fill();
    rr(x - w * 0.3, y + h * 0.46, w * 0.6, h * 0.2, r * 0.5); ctx.fill();
    ctx.fillStyle = 'rgba(150, 200, 255, 0.16)';
    rr(x - w * 0.3, y + h * 0.21, w * 0.6, h * 0.045, 2); ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.13)';
    ctx.fillRect(x - 1.1, y + h * 0.06, 2.2, h * 0.88);

    ctx.shadowBlur = 12;
    if (rear) {
      ctx.fillStyle = '#ff3b30';
      ctx.shadowColor = '#ff3b30';
      rr(x - w * 0.38, y + h - 6, w * 0.24, 3.4, 1.6); ctx.fill();
      rr(x + w * 0.14, y + h - 6, w * 0.24, 3.4, 1.6); ctx.fill();
    } else {
      ctx.fillStyle = '#fff3c4';
      ctx.shadowColor = '#fff3c4';
      rr(x - w * 0.36, y + 2.2, w * 0.22, 3.4, 1.6); ctx.fill();
      rr(x + w * 0.14, y + 2.2, w * 0.22, 3.4, 1.6); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawRoad() {
    ctx.fillStyle = '#080609';
    ctx.fillRect(0, 0, W, H);

    const shoulder = ctx.createLinearGradient(0, 0, W, 0);
    shoulder.addColorStop(0, 'rgba(255, 59, 77, 0.09)');
    shoulder.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
    shoulder.addColorStop(1, 'rgba(255, 59, 77, 0.09)');
    ctx.fillStyle = shoulder;
    ctx.fillRect(0, 0, W, H);

    const asphalt = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
    asphalt.addColorStop(0, '#15141a');
    asphalt.addColorStop(0.5, '#1e1d25');
    asphalt.addColorStop(1, '#15141a');
    ctx.fillStyle = asphalt;
    ctx.fillRect(roadX, 0, roadW, H);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.022)';
    for (let y = -dash; y < H; y += 26) ctx.fillRect(roadX, y, roadW, 1);

    const horizon = ctx.createLinearGradient(0, 0, 0, H * 0.4);
    horizon.addColorStop(0, 'rgba(120, 12, 28, 0.45)');
    horizon.addColorStop(1, 'rgba(120, 12, 28, 0)');
    ctx.fillStyle = horizon;
    ctx.fillRect(0, 0, W, H * 0.4);

    ctx.strokeStyle = 'rgba(255, 59, 77, 0.85)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#ff3b4d';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(roadX + 1, 0); ctx.lineTo(roadX + 1, H);
    ctx.moveTo(roadX + roadW - 1, 0); ctx.lineTo(roadX + roadW - 1, H);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
    for (let i = 1; i < LANES; i += 1) {
      const x = roadX + laneW * i - 1.5;
      for (let y = -90 + dash; y < H; y += 90) ctx.fillRect(x, y, 3, 44);
    }
  }

  function drawBeams() {
    const top = player.y;
    const g = ctx.createLinearGradient(0, top, 0, top - H * 0.55);
    g.addColorStop(0, 'rgba(255, 238, 190, 0.3)');
    g.addColorStop(1, 'rgba(255, 238, 190, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(player.x - player.w * 0.4, top);
    ctx.lineTo(player.x - player.w * 2.5, top - H * 0.55);
    ctx.lineTo(player.x + player.w * 2.5, top - H * 0.55);
    ctx.lineTo(player.x + player.w * 0.4, top);
    ctx.closePath();
    ctx.fill();
  }

  function drawCoin(c) {
    const k = Math.abs(Math.cos(c.t * 3.2));
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.shadowColor = '#ffd84a';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffd84a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 9 * Math.max(0.35, k), 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff6c9';
    ctx.beginPath();
    ctx.ellipse(0, 0, 5 * Math.max(0.2, k), 4.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function render(dt) {
    dash = (dash + speed * dt) % 90;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
    drawRoad();

    // boost speed lines
    if (streaks.length) {
      ctx.strokeStyle = 'rgba(255, 220, 190, 0.2)';
      ctx.lineWidth = 2;
      streaks.forEach((s) => {
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x, s.y + s.len);
        ctx.stroke();
      });
    }

    drawBeams();
    coins.forEach(drawCoin);
    traffic.forEach((c) => drawCar(c.x, c.y, c.w, c.h, c.color, true));

    if (state !== 'over') drawCar(player.x, player.y, player.w, player.h, '#e11d2e', false);

    sparks.forEach((p) => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, 3.5, 3.5);
    });
    ctx.globalAlpha = 1;

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 90, 60, ${flash * 0.55})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  /* ---------- hud ---------- */
  function syncHud() {
    el.score.textContent = Math.floor(scoreF);
    el.speed.textContent = Math.round(speed * 0.17);
    el.nitroFill.style.width = `${Math.round(nitro)}%`;
    el.nitroWrap.classList.toggle('is-on', boosting);
  }

  /* ---------- loop ---------- */
  function frame(ts) {
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
    last = ts;

    if (state === 'run') updateRun(dt);
    else updateIdle(dt);

    if (engine && engineGain) {
      const norm = clamp((speed - H * 0.5) / (H * 0.8), 0, 1);
      try { engine.frequency.setTargetAtTime(58 + norm * 96, actx.currentTime, 0.1); } catch { /* audio gone */ }
    }

    render(dt);
    syncHud();
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  const setHold = (key, value) => { held[key] = value; };

  window.addEventListener('keydown', (event) => {
    const k = event.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { held.left = true; event.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { held.right = true; event.preventDefault(); }
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') { held.nitro = true; event.preventDefault(); }
    else if (k === ' ' || k === 'Enter') {
      event.preventDefault();
      if (state === 'run') held.nitro = true;
      else if (!event.repeat) startRun();
    }
  });

  window.addEventListener('keyup', (event) => {
    const k = event.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') held.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') held.right = false;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') held.nitro = false;
  });

  const bindHold = (btn, key) => {
    const on = (event) => { event.preventDefault(); setHold(key, true); };
    const off = () => setHold(key, false);
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointerleave', off);
    btn.addEventListener('pointercancel', off);
  };
  bindHold(el.left, 'left');
  bindHold(el.right, 'right');
  bindHold(el.nitro, 'nitro');

  cvs.addEventListener('pointerdown', (event) => {
    dragging = true;
    cvs.setPointerCapture?.(event.pointerId);
    player.x = clamp(event.offsetX, roadX + player.w * 0.6, roadX + roadW - player.w * 0.6);
  });
  cvs.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    player.x = clamp(event.offsetX, roadX + player.w * 0.6, roadX + roadW - player.w * 0.6);
  });
  const endDrag = () => { dragging = false; };
  cvs.addEventListener('pointerup', endDrag);
  cvs.addEventListener('pointercancel', endDrag);

  el.start.addEventListener('click', startRun);
  el.again.addEventListener('click', startRun);

  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
