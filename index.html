<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angel's Windows</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./apps.css">
<link rel="stylesheet" href="./logos.css">
<link rel="stylesheet" href="./boot.css">
</head>
<body>
  <div class="boot" id="boot-screen" role="dialog" aria-live="polite" aria-label="Angel's Windows update">
    <div class="boot-inner">
      <span class="boot-logo win-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div class="boot-ring"><span id="boot-percent">0%</span></div>
      <h1 class="boot-title">Working on updates</h1>
      <p class="boot-hint">Don't turn off your PC. This will take a while.</p>
      <ol class="boot-log" id="boot-log"></ol>
      <p class="boot-skip">Click anywhere to skip</p>
    </div>
  </div>

  <div class="desktop">
    <div class="wallpaper" aria-hidden="true">
      <span class="bloom bloom-a"></span>
      <span class="bloom bloom-b"></span>
      <span class="bloom bloom-c"></span>
      <span class="ribbon"></span>
    </div>

    <div class="desktop-icons">
      <button class="desk-icon" data-app="readme">
        <span class="tile tile-readme" aria-hidden="true"></span>
        <span class="desk-label">README</span>
      </button>
    </div>

    <div class="windows" id="windows"></div>

    <div class="watermark">Angel's Windows 11 · Preview build</div>

    <div class="start-menu" id="start-menu" hidden>
      <label class="start-search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="13" y1="13" x2="17.5" y2="17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="start-search-input" placeholder="Search apps, settings and documents" aria-label="Search apps">
      </label>

      <div class="start-head">
        <span>Pinned</span>
        <span class="start-more">All apps &rsaquo;</span>
      </div>

      <div class="pinned" id="pinned">
        <button class="pin" data-app="readme"><span class="tile tile-readme"></span><span>README</span></button>
        <button class="pin" data-app="games"><span class="tile tile-games"></span><span>Games</span></button>
        <button class="pin" data-app="browser"><span class="tile tile-edge"></span><span>Edge</span></button>
        <button class="pin" data-app="store"><span class="tile tile-store"></span><span>Store</span></button>
        <button class="pin" data-app="notes"><span class="tile tile-notes"></span><span>Notes</span></button>
        <button class="pin" data-app="calculator"><span class="tile tile-calc"></span><span>Calculator</span></button>
        <button class="pin" data-app="calendar"><span class="tile tile-calendar"></span><span>Calendar</span></button>
        <button class="pin" data-app="weather"><span class="tile tile-weather"></span><span>Weather</span></button>
        <button class="pin" data-app="terminal"><span class="tile tile-terminal"></span><span>Terminal</span></button>
        <button class="pin" data-app="ai"><span class="tile tile-ai"></span><span>AI Studio</span></button>
        <button class="pin" data-app="settings"><span class="tile tile-settings"></span><span>Settings</span></button>
      </div>

      <div class="start-head"><span>Recommended</span></div>
      <div class="recommended">
        <button class="rec" data-app="readme">
          <span class="tile tile-readme small"></span>
          <span><strong>README.md</strong><em>Angel's Windows</em></span>
        </button>
        <button class="rec" data-app="browser">
          <span class="tile tile-edge small"></span>
          <span><strong>Edge</strong><em>Search DuckDuckGo privately</em></span>
        </button>
      </div>

      <footer class="start-footer">
        <span class="user"><span class="avatar">A</span>Angel</span>
        <button class="power" data-power>Power</button>
      </footer>
    </div>

    <footer class="taskbar">
      <div class="tb-center">
        <button class="tb-btn" id="start-btn" aria-label="Start" aria-expanded="false">
          <span class="win-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>
        <button class="tb-btn" id="search-btn" aria-label="Search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="13" y1="13" x2="17.5" y2="17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="tb-btn tb-app" data-app="readme" aria-label="README"><span class="tile tile-readme"></span></button>
        <button class="tb-btn tb-app" data-app="games" aria-label="Games"><span class="tile tile-games"></span></button>
        <button class="tb-btn tb-app" data-app="browser" aria-label="Edge"><span class="tile tile-edge"></span></button>
        <button class="tb-btn tb-app" data-app="store" aria-label="Store"><span class="tile tile-store"></span></button>
        <button class="tb-btn tb-app" data-app="notes" aria-label="Notes"><span class="tile tile-notes"></span></button>
        <button class="tb-btn tb-app" data-app="calculator" aria-label="Calculator"><span class="tile tile-calc"></span></button>
        <button class="tb-btn tb-app" data-app="calendar" aria-label="Calendar"><span class="tile tile-calendar"></span></button>
        <button class="tb-btn tb-app" data-app="weather" aria-label="Weather"><span class="tile tile-weather"></span></button>
        <button class="tb-btn tb-app" data-app="terminal" aria-label="Terminal"><span class="tile tile-terminal"></span></button>
        <button class="tb-btn tb-app" data-app="ai" aria-label="AI Studio"><span class="tile tile-ai"></span></button>
        <button class="tb-btn tb-app" data-app="settings" aria-label="Settings"><span class="tile tile-settings"></span></button>
      </div>
      <div class="tray">
        <span class="tray-icons" aria-hidden="true">
          <svg viewBox="0 0 20 20"><path d="M2 12.5a11 11 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5.5 15a6.5 6.5 0 0 1 9 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="17" r="1" fill="currentColor"/></svg>
          <svg viewBox="0 0 20 20"><path d="M4 8.5v3h2.5L11 15V5L6.5 8.5z" fill="currentColor"/><path d="M13.5 7.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 20 20"><rect x="2.5" y="6.5" width="13" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4.5" y="8.5" width="7" height="3" rx="1" fill="currentColor"/><path d="M17 9v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="clock"><span id="clock-time">--:-- --</span><span id="clock-date"></span></span>
      </div>
    </footer>
  </div>
  <script type="module" src="./boot.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
