<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ather's Legendary Proxy — Start</title>
<style>
  :root {
    --accent: #ff3b4d;
    --ink: #f7ecee;
    --muted: #bda9ad;
    --faint: #8d6b70;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(120% 90% at 50% 0%, #2b070c 0%, #0b0507 48%, #000 100%);
    color: var(--ink);
    font: 14px/1.5 "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: min(520px, 100%); margin: 0 auto; display: grid; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(140deg, #ff3b4d, #8a0d1a); box-shadow: 0 0 18px rgba(255, 59, 77, 0.45); flex: 0 0 auto; }
  h1 { margin: 0; font-size: clamp(22px, 4.4vw, 27px); font-weight: 700; letter-spacing: -0.025em; color: #fff; }
  h1 span { color: var(--accent); }
  .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; height: 42px; padding: 0 14px;
    border-radius: 10px; border: 1px solid rgba(255, 59, 77, 0.35);
    background: #140b0e; color: var(--ink); font: inherit;
  }
  input::placeholder { color: #9a7f84; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 59, 77, 0.2); }
  button {
    height: 42px; padding: 0 18px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(140deg, #ff3b4d, #c8142a); color: #fff; font: inherit; font-weight: 600;
  }
  button:hover { filter: brightness(1.1); }
  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .link {
    display: block; padding: 12px 10px; text-align: center; text-decoration: none;
    border-radius: 10px; border: 1px solid rgba(255, 59, 77, 0.22); background: #150a0e;
    color: var(--ink); font-size: 12.5px;
  }
  .link:hover { background: #221016; border-color: rgba(255, 59, 77, 0.45); color: #fff; }
  .note { margin: 0; text-align: center; font-size: 11.5px; color: var(--faint); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>Ather's <span>Legendary Proxy</span></h1>
        <p class="sub">Your own black and red browser</p>
      </div>
    </div>

    <form id="search" role="search">
      <input id="q" type="text" placeholder="Search DuckDuckGo or enter a URL" aria-label="Search DuckDuckGo or enter a URL" autocomplete="off" spellcheck="false" autofocus>
      <button type="submit">Go</button>
    </form>

    <nav class="links" aria-label="Quick links">
      <a class="link" href="https://duckduckgo.com/">DuckDuckGo</a>
      <a class="link" href="https://www.youtube.com/">YouTube</a>
      <a class="link" href="https://en.wikipedia.org/">Wikipedia</a>
      <a class="link" href="https://github.com/">GitHub</a>
      <a class="link" href="https://www.reddit.com/">Reddit</a>
      <a class="link" href="https://www.twitch.tv/">Twitch</a>
    </nav>

    <p class="note">Searches and links open inside this window, through the proxy.</p>
  </div>

<script>
  /* Ask the desktop window to load pages, so links stay inside the proxy view. */
  function open(url) {
    var inFrame = window.parent && window.parent !== window;
    if (inFrame) {
      try { window.parent.postMessage({ source: "angels-proxy", type: "navigate", url: url }, "*"); return; } catch (e) {}
    }
    window.location.href = url;
  }

  var isAddress = function (value) { return /^https?:\/\//i.test(value) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(value); };
  var withScheme = function (value) { return /^https?:\/\//i.test(value) ? value : "https://" + value; };

  document.getElementById("search").addEventListener("submit", function (event) {
    event.preventDefault();
    var value = document.getElementById("q").value.trim();
    if (!value) return;
    open(isAddress(value) ? withScheme(value) : "https://duckduckgo.com/?q=" + encodeURIComponent(value));
  });

  document.querySelectorAll(".link").forEach(function (a) {
    a.addEventListener("click", function (event) {
      event.preventDefault();
      open(a.href);
    });
  });
</script>
</body>
</html>
